name: Record Dashboard Animation
on:
  schedule:
    - cron: "0 0 * * *" # Roda uma vez por dia as 00:00
  workflow_dispatch: # Permite rodar manualmente clicando num botao no Github

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Instalar NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Instalar dependencias do Headless Browser (Puppeteer)
        run: |
          npm init -y
          npm install puppeteer@19.0.0 puppeteer-screen-recorder@3.0.6

      - name: Criar Script de Gravacao Automatica do Dashboard
        run: |
          cat << 'EOF' > record_dashboard.cjs
          const puppeteer = require('puppeteer');
          const { PuppeteerScreenRecorder } = require('puppeteer-screen-recorder');

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              timeout: 120000,
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--window-size=1600,1024']
            });
            const page = await browser.newPage();
            
            // Forca tamanho da janela ser super wide p/ horizontal, mas curto na vertical cortando as fitas pretas
            await page.setViewport({ width: 1600, height: 1024, deviceScaleFactor: 2 });
            
            // Acessa o painel de producao no Vercel
            const timestamp = new Date().getTime();
            const statsReady = page.waitForResponse(response => response.url().includes('/api/github-stats') && response.url().includes('fresh=true') && response.ok(), { timeout: 60000 });
            const languagesReady = page.waitForResponse(response => response.url().includes('/api/github-languages') && response.url().includes('fresh=true') && response.ok(), { timeout: 60000 });

            await page.goto(`https://github-stats-wmakeouthill.vercel.app/?fresh=true&t=${timestamp}`, {
              waitUntil: 'networkidle0',
              timeout: 60000 
            });

            await Promise.all([statsReady, languagesReady]);

            // Respiro pro React montar o Grimorio e preencher os espacos
            await new Promise(r => setTimeout(r, 5000));

            const Config = {
              followNewTab: false,
              fps: 30,
              videoFrame: { width: 1600, height: 1024 },
              videoCrf: 28,
              videoCodec: 'libx264',
              videoPreset: 'ultrafast',
              videoBitrate: 2500,
              aspectRatio: '16:10' // Encaixe matematicamente perfeito de proporcao sem distorcoes
            };
            
            const recorder = new PuppeteerScreenRecorder(page, Config);
            
            console.log('Gravando dashboard no Vacuo Cosmico (MP4)...');
            await recorder.start('./dashboard_animated.mp4');
            
            // Filma exatos 6.5 segundos magicos
            await new Promise(r => setTimeout(r, 6500));
            
            await recorder.stop();
            await browser.close();
            console.log('Gravacao original MP4 finalizada com sucesso!');
          })();
          EOF

      - name: Gravar Dashboard (Puppeteer)
        run: node record_dashboard.cjs

      - name: Instalar FFmpeg e Converter para WebP Optimizado
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          echo "Convertendo video ultra qualitativo MP4 para WebP super compactado animado..."
          # Filtros: Resize pra um Readme aceitavel e loop infinito em otima qualidade de frames
          ffmpeg -i dashboard_animated.mp4 -vcodec libwebp -filter:v fps=fps=15 -lossless 0 -compression_level 6 -q:v 50 -loop 0 -preset default -an -vsync 0 dashboard_animated.webp

      - name: Mover a gravacao webp final para os assets publicos e limpar lixo do NodeJS actions
        run: |
          mkdir -p public/assets # Cria pasta caso nao exista para organizar o seu root directory
          mv dashboard_animated.webp public/assets/
          rm -rf node_modules package.json package-lock.json record_dashboard.cjs dashboard_animated.mp4

      - name: Atualizar Gravacao Webp no Repositorio sem Inchar o Historico 🚀
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/assets/dashboard_animated.webp
          
          # Se o ultimo commit for uma gravacao automatica, sobrescreve (--amend) para manter o repo sempre leve
          LAST_MSG=$(git log -1 --pretty=%B)
          if [[ "$LAST_MSG" == *"Auto-Update Dashboard Cosmic Recording"* ]]; then
            echo "Sobrescrevendo gravacao anterior com git commit --amend..."
            git commit --amend -m "✨ chore: Auto-Update Dashboard Cosmic Recording (Webp Animation)"
            git push --force origin main
          else
            echo "Criando novo commit de gravacao..."
            git commit -m "✨ chore: Auto-Update Dashboard Cosmic Recording (Webp Animation)"
            git push origin main
          fi
